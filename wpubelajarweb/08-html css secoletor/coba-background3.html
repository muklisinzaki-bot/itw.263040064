<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>coba background</title>
    <style>
        body {
            background-color:blue;
            background-image: linear-gradient(10deg, red, yellow, green, blue, purple);
            height: 100vh;
        }

        .kotak {
            width: 200px;
            height: 200px;
            background-color: red;
            background-image: linear-gradient(to bottom, lightblue, lightgreen);
        }
        .kotak2 {
            width: 200px;
            height: 200px;
            background-color: red;
            background-image: radial-gradient(blue, lightblue, lightgreen);
        }
        kotak3 {
            width: 200px;
            height: 200px;
            background-color: red;
            background-image: conic-gradient(red, green,  blue );
        }
    </style>
</head>
<body>
    <div class="kotak"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
